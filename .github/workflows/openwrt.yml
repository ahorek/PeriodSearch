name: OpenWRT

on:
  push:
    branches:
      - main
      - dev
      - openwrt

  pull_request:
    branches:
      - main
      - dev
      - openwrt

env:
  BOINC_DIR: ./boinc_src

jobs:
  aarch64:
    runs-on: ubuntu-latest

    name: 'OpenWRT aarch64'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Download and setup OpenWRT SDK
        run: |
          # Download OpenWRT SDK for aarch64_cortex-a53
          wget https://downloads.openwrt.org/releases/24.10.3/targets/mediatek/mt7622/openwrt-sdk-24.10.3-mediatek-mt7622_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar -xJf openwrt-sdk-24.10.3-mediatek-mt7622_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          mv openwrt-sdk-24.10.3-mediatek-mt7622_gcc-13.3.0_musl.Linux-x86_64 openwrt

      - name: Print toolchain info
        run: |
          export STAGING_DIR=$PWD/openwrt/staging_dir/toolchain-aarch64_cortex-a53_gcc-13.3.0_musl
          if [ -f "$STAGING_DIR/bin/aarch64-openwrt-linux-musl-g++" ]; then
            $STAGING_DIR/bin/aarch64-openwrt-linux-musl-g++ -v
          else
            echo "Toolchain not found, listing staging_dir contents:"
            ls -la openwrt/staging_dir/
          fi

